name: KennyOS Daily Sync
on:
  schedule:
    # 每日 2AM HKT (下午6點 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Pull from GitHub
        run: |
          gh repo sync kennylimkamho/kennyOS --source kennylimkamho/kennyOS

      - name: Run consolidation
        run: |
          bun run src/agents/consolidation.ts

      - name: Push updates
        run: |
          git add .
          git commit -m "Auto: Daily consolidation $(date '+%Y-%m-%d')"
          git push

      - name: Generate morning brief
        run: |
          bun run src/agents/morning-brief.ts
          echo "MORNING_BRIEF=$(cat morning-brief.md)" >> $GITHUB_ENV

      - name: Notify
        run: |
          echo "Daily sync completed at $(date)"